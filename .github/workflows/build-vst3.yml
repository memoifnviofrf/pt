
name: build-vst3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build DSP tests and CLI
        run: cmake --build build --config Release --target vts_cli PitchDetectorTest NoteSegmenterTest PitchShifterTest PitchEditorTest VibratoTimingTest SessionTest UtilTest

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build VST3
        run: cmake --build build --config Release --target VocalTuneStudio_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VOCAL-TUNE-STUDIO-vst3-windows-x64
          path: build/VocalTuneStudio_artefacts/Release/VST3/

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: vts_cli-windows-x64
          path: build/Release/vts_cli.exe
